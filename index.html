
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Burak Cloud Wonder Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: app shell. Dark sidebar (products + sections), sticky top bar, content area of panels. One section visible at a time. */
:root{
  --bg:#EFF4F5; --panel:#FFFFFF; --panel2:#F5F8F9; --ink:#10232A; --ink2:#4B6168; --ink3:#7B8E93; --line:#DCE5E7;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --saffron:#B4720C; --good:#2B8253; --warn:#B0731A; --crit:#BC3A2E; --blue:#3567C4; --violet:#6F5BC9;
  --side:#0B262C; --side-ink:#CFE0E3; --side-ink2:#7FA3A9; --side-hi:#143B43;
  --f-display:"Plus Jakarta Sans","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(16,40,48,.05),0 10px 26px -18px rgba(16,40,48,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1316; --panel:#111D21; --panel2:#16252A; --ink:#E2ECEE; --ink2:#9DB1B6; --ink3:#6E848A; --line:#22353B;
  --accent:#4BC0C9; --accent-ink:#04181B; --saffron:#E5A445; --good:#57BC82; --warn:#E2A54B; --crit:#E8705F; --blue:#7DA0EA; --violet:#A796EC;
  --side:#071619; --side-ink:#C6D8DB; --side-ink2:#6D9097; --side-hi:#10313A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1316; --panel:#111D21; --panel2:#16252A; --ink:#E2ECEE; --ink2:#9DB1B6; --ink3:#6E848A; --line:#22353B;
  --accent:#4BC0C9; --accent-ink:#04181B; --saffron:#E5A445; --good:#57BC82; --warn:#E2A54B; --crit:#E8705F; --blue:#7DA0EA; --violet:#A796EC;
  --side:#071619; --side-ink:#C6D8DB; --side-ink2:#6D9097; --side-hi:#10313A; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#2FB6C2,#0A5560);display:grid;place-items:center;flex:none}
.brand b{font:800 18px/1 var(--f-display);color:#fff;letter-spacing:-.02em}
.brand b span{color:#F0B03E}
.brand small{display:block;font-size:11px;color:var(--side-ink2);margin-top:3px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink2);padding:0 8px;margin-bottom:-8px}
.prods,.navs{display:flex;flex-direction:column;gap:2px}
.prod,.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;color:var(--side-ink);width:100%}
.prod:hover,.nav:hover{background:var(--side-hi)}
.prod i{width:8px;height:8px;border-radius:50%;flex:none}
.prod small{margin-left:auto;font-size:10.5px;color:var(--side-ink2)}
.prod[aria-current="true"],.nav[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,#2FB6C2 30%,var(--side-hi)),var(--side-hi));color:#fff}
.nav svg{width:16px;height:16px;flex:none}
.nav .ct{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1)}
.nav .ct.hot{background:#E8705F;color:#fff}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--side-ink2);padding:0 8px;line-height:1.5}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.crumb{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.crumb b{color:var(--ink)}
.chip{font:500 11.5px var(--f-mono);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05);color:var(--accent-ink)}
.content{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph .eb{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.ph h1{font-size:27px;font-weight:800;margin-top:3px}
.ph p{margin:4px 0 0;color:var(--ink2);max-width:720px}
.sim{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--saffron) 15%,transparent);color:var(--saffron)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);min-width:0}
.panel>h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel>h3::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(var(--accent),var(--saffron))}
.panel .sub{font-size:12.5px;color:var(--ink2);margin:2px 0 12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 7%,var(--panel)),var(--panel) 70%);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--sh)}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--kc)}
.kpi small{display:block;font-size:12px;color:var(--ink2)}
.kpi b{display:block;font:800 25px/1.15 var(--f-display);letter-spacing:-.03em;margin-top:3px}
.kpi b em{font:600 12.5px var(--f-body);color:var(--ink2);font-style:normal;margin-left:3px}
.kpi span{font-size:11.5px;color:var(--ink3)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.st{position:relative;padding:12px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.st:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:700;z-index:1}
.st .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:800 11px var(--f-display);color:#fff;background:var(--sc)}
.st b{display:block;font:700 14px var(--f-display);margin-top:7px}
.st small{display:block;font-size:12px;color:var(--ink2);line-height:1.4}
.st .v{font:700 16px var(--f-display);margin-top:6px;color:var(--sc)}
/* site board */
.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.site{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.site h4{font-size:14px}
.site p{margin:2px 0 8px;font-size:12px;color:var(--ink2)}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.bx{border:0;border-radius:8px;padding:5px 8px;font:600 11.5px var(--f-mono);background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good)}
.bx.warn{background:color-mix(in srgb,var(--warn) 16%,var(--panel));color:var(--warn)}
.bx.crit{background:color-mix(in srgb,var(--crit) 15%,var(--panel));color:var(--crit)}
.bx.off{background:var(--panel);color:var(--ink3);border:1px dashed var(--line)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink2);background:color-mix(in srgb,var(--accent) 6%,var(--panel2));padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tbody tr[aria-selected="true"] td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.r{text-align:right}
.pill{font:600 11px/1 var(--f-body);padding:4px 9px;border-radius:99px;display:inline-block;white-space:nowrap}
.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.am{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.rd{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.bl{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.gr{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
.src{display:inline-flex;align-items:center;gap:6px}
.src i{width:8px;height:8px;border-radius:2px}
.score{display:inline-flex;align-items:center;gap:8px}
.score i{display:block;width:54px;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.score i em{display:block;height:100%;border-radius:9px}
/* box detail */
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rd2{padding:10px 11px;border-radius:11px;background:var(--panel2);border-left:3px solid var(--good)}
.rd2.watch{border-left-color:var(--warn)}.rd2.out{border-left-color:var(--crit);background:color-mix(in srgb,var(--crit) 6%,var(--panel2))}
.rd2 small{display:block;font-size:11.5px;color:var(--ink2)}
.rd2 b{font:700 17px var(--f-display)}
.rd2 b em{font:500 11px var(--f-body);color:var(--ink3);font-style:normal;margin-left:2px}
.rd2 span{display:block;font-size:11px;color:var(--ink3)}
.rd2 svg{display:block;width:100%;height:26px;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600;text-align:right}
/* events */
.evs{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ev .bar{align-self:stretch;border-radius:4px;background:var(--ec)}
.ev h4{font-size:14.5px}
.ev p{margin:2px 0 6px;font-size:12.5px;color:var(--ink2)}
.ev .tr{display:flex;flex-wrap:wrap;gap:5px}
.ev .tr span{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.ev .meta{text-align:right;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rule{padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--ec) 8%,var(--panel)),var(--panel) 70%)}
.rule b{display:flex;align-items:center;gap:7px;font:700 14px var(--f-display)}
.rule b i{width:9px;height:9px;border-radius:3px;background:var(--ec)}
.rule p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
/* model */
.f{font-family:var(--f-mono);font-size:13px;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);overflow-x:auto;white-space:pre}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps>div{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.steps b{font:700 14px var(--f-display)}.steps p{margin:4px 0 8px;font-size:12.5px;color:var(--ink2)}
/* data link */
.link{display:grid;grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr);align-items:center;gap:10px}
.end{padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--panel2)}
.end b{font:700 15px var(--f-display);display:block}
.end small{font-size:12px;color:var(--ink2)}
.wire{height:2px;background:linear-gradient(90deg,var(--accent),var(--saffron));position:relative;border-radius:2px}
.wire::after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:flow 1.6s linear infinite}
@keyframes flow{from{left:0}to{left:calc(100% - 8px)}}
.tog{display:flex;flex-direction:column;gap:8px}
.tog label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px;cursor:pointer}
.tog label small{display:block;color:var(--ink3);font-size:12px}
.tog input{accent-color:var(--accent);width:16px;height:16px}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.log div:last-child{border-bottom:0}
.code{font-family:var(--f-mono);font-size:12px;line-height:1.55;padding:12px 14px;border-radius:10px;background:#0B1F24;color:#CFE6E9;overflow-x:auto;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--sh);z-index:20}
.note{font-size:12px;color:var(--ink3);margin:0}
@media (prefers-reduced-motion:reduce){.wire::after{animation:none}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g3,.det{grid-template-columns:1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:column;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px}.navs{flex-direction:row;overflow-x:auto}.nav{width:auto;white-space:nowrap}.prods{flex-direction:row;overflow-x:auto}.prod{width:auto;white-space:nowrap}.sidefoot,.sec{display:none}.g2,.sites,.steps{grid-template-columns:1fr}.pipe{grid-template-columns:1fr 1fr}.st::after{display:none}.link{grid-template-columns:1fr}.wire{height:24px;width:2px;margin:0 auto;background:linear-gradient(var(--accent),var(--saffron))}.wire::after{display:none}}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.reads{grid-template-columns:1fr 1fr}.top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.ph h1{font-size:23px}}
</style>

</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3c3.5 4.5 6 7.6 6 10.5A6 6 0 0 1 6 13.5C6 10.6 8.5 7.5 12 3z"/></svg></span><div><b>Burak <span>Cloud</span></b><small>One pipeline · many products</small></div></div>
  <div class="sec">Products</div>
  <div class="prods">
   <button class="prod" type="button" data-toast="Burak Ovine opens in its own app."><i style="background:#57BC82"></i>Burak Ovine<small>sheep</small></button>
   <button class="prod" type="button" aria-current="true"><i style="background:#4BC0C9"></i>Wonder Box<small>water</small></button>
   <button class="prod" type="button" data-toast="Human health runs in a separate, secured project."><i style="background:#A796EC"></i>Human health<small>clinical</small></button>
  </div>
  <div class="sec">Wonder Box</div>
  <nav class="navs" id="nav"></nav>
  <div class="sidefoot">Pilot · Shopian, Pulwama, Pampore<br>Demo data, simulated</div>
 </aside>
 <div class="main">
  <header class="top">
   <div class="crumb" id="crumb">Wonder Box / <b>Overview</b></div>
   <span class="chip"><span class="dot"></span>18 boxes · synced 2 min ago</span>
   <span class="chip" id="skchip"><span class="dot"></span>SKUAST-K link live</span>
   <button class="btn" type="button" id="themeBtn">Theme</button>
  </header>
  <main class="content" id="view"></main>
 </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const R=(()=>{let s=20261017;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};})();
const $=s=>document.querySelector(s);
const fmt=(n,d=0)=>Number(n).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const SRC={Borewell:'var(--blue)',Spring:'var(--good)',Canal:'var(--saffron)',Stream:'var(--violet)'};
const SITES=[
 {k:'SHP',n:'Shopian',c:'Apple, high-density',d:'South Kashmir orchard belt'},
 {k:'PLW',n:'Pulwama',c:'Apple and cherry',d:'Karewa terraces'},
 {k:'PMP',n:'Pampore',c:'Saffron',d:'Karewa saffron fields'}];
const RANGES={ec:[150,700,'µS/cm','Salts (EC)'],ph:[6.5,8.0,'','pH'],turb:[0,5,'NTU','Cloudiness'],press:[1.5,3.0,'bar','Pressure'],temp:[6,18,'°C','Water temp'],flow:[0,0,'m³','Flow today']};
// boxes
const BOXES=[];
const plan=[['SHP',7],['PLW',6],['PMP',5]];
const srcs=['Borewell','Spring','Canal','Stream'];
let idx=0;
plan.forEach(([k,n])=>{for(let i=1;i<=n;i++){idx++;
 const site=SITES.find(s=>s.k===k),src=k==='PMP'?(i%2?'Borewell':'Canal'):srcs[(i+idx)%4];
 const need=k==='PMP'?+(6+R()*4).toFixed(1):+(14+R()*10).toFixed(1);
 let used=+(need*(0.85+R()*0.6)).toFixed(1),ec=Math.round(260+R()*260),ph=+(6.9+R()*0.8).toFixed(1),turb=+(0.6+R()*2.6).toFixed(1),press=+(2+R()*0.7).toFixed(1),temp=+(9+R()*5).toFixed(1),status='ok',ev=null;
 const id=`WB-${k}-${String(i).padStart(2,'0')}`;
 if(id==='WB-SHP-03'){turb=11.8;ec=812;ev='runoff';status='crit';}
 if(id==='WB-PLW-02'){press=1.1;ec=745;used=+(need*1.55).toFixed(1);ev='overpump';status='warn';}
 if(id==='WB-SHP-06'){ev='contam';status='warn';turb=4.4;ec=690;}
 if(id==='WB-PMP-04'){used=+(need*0.55).toFixed(1);ev='under';status='warn';}
 if(id==='WB-PLW-05'){status='off';}
 BOXES.push({id,k,site,src:id==='WB-SHP-03'?'Spring':src,crop:site.c,need,used,ec,ph,turb,press,temp,status,ev,sync:status==='off'?'6 h ago':`${1+Math.floor(R()*9)} min ago`});}});
BOXES.forEach(b=>{const z=[(b.ec-425)/137,(b.ph-7.25)/.37,(b.turb-2.5)/1.25,(2.25-b.press)/.37].map(v=>Math.max(0,Math.abs(v)-1));b.score=Math.max(18,Math.round(100-z.reduce((a,v)=>a+v,0)*14));if(b.status==='off')b.score=null;});
const stOf=(v,[lo,hi])=>v<lo||v>hi?'out':(v<lo+(hi-lo)*.1||v>hi-(hi-lo)*.1)?'watch':'ok';
const EVT={
 runoff:{n:'Runoff',c:'var(--crit)',rule:'Cloudiness and salts jump together within hours of rain or orchard spraying.',tr:['Turbidity > 10 NTU','EC up > 40% vs source normal','Rain or spray logged in last 24 h']},
 overpump:{n:'Over-pumping',c:'var(--warn)',rule:'Pressure and flow fall while salts rise: the borewell is being drawn too hard.',tr:['Pressure < 1.5 bar','EC rising 3 days running','Use > 140% of crop need']},
 contam:{n:'Contamination watch',c:'var(--violet)',rule:'An unusual pattern at a source the sensors cannot explain. A lab test is requested.',tr:['EC and turbidity drifting from source normal','Spring season, spray window','No rain to explain it']},
 under:{n:'Under-watering',c:'var(--blue)',rule:'The crop got far less than it needed for several days.',tr:['Use < 60% of crop need','3 days running','Hot, dry forecast']},
 leak:{n:'Leak or pressure loss',c:'var(--saffron)',rule:'Flow continues with no valve open, or pressure drops suddenly.',tr:['Night flow > 0 with valves shut','Pressure drop > 30% in an hour']}};
const EVENTS=[
 {id:'E-1042',k:'runoff',box:'WB-SHP-03',when:'Today 06:40',st:['rd','Open · lab requested'],note:'Turbidity 11.8 NTU and EC 812 µS/cm after overnight rain and a fungicide spray on 16 Oct.'},
 {id:'E-1041',k:'overpump',box:'WB-PLW-02',when:'Yesterday 18:15',st:['am','Open'],note:'Pressure 1.1 bar; use 155% of crop need; EC rising for 3 days.'},
 {id:'E-1039',k:'contam',box:'WB-SHP-06',when:'16 Oct 11:20',st:['bl','Sample at SKUAST-K lab'],note:'Slow drift in EC and cloudiness with no rain. Pesticide panel requested.'},
 {id:'E-1036',k:'under',box:'WB-PMP-04',when:'15 Oct 09:00',st:['am','Advisory sent'],note:'Saffron field got 55% of its need for 3 days during corm sprouting.'},
 {id:'E-1030',k:'leak',box:'WB-PLW-04',when:'12 Oct 02:10',st:['ok','Closed · fixed'],note:'Night flow with valves shut. Cracked joint on the manifold outlet, replaced.'}];
const LAB=[
 {s:'S-2207',box:'WB-SHP-03',ev:'E-1042',sent:'Today',test:'Pesticide panel + nitrate',st:['am','Collected'],res:'—'},
 {s:'S-2204',box:'WB-SHP-06',ev:'E-1039',sent:'16 Oct',test:'Pesticide panel',st:['bl','At SKUAST-K lab'],res:'Due 21 Oct'},
 {s:'S-2196',box:'WB-SHP-01',ev:'Routine',sent:'01 Oct',test:'Monthly routine panel',st:['ok','Result in'],res:'Chlorpyrifos detected, below limit'},
 {s:'S-2195',box:'WB-PLW-03',ev:'Routine',sent:'01 Oct',test:'Monthly routine panel',st:['ok','Result in'],res:'None detected'},
 {s:'S-2193',box:'WB-PMP-02',ev:'Routine',sent:'01 Oct',test:'Monthly routine panel',st:['ok','Result in'],res:'Nitrate 38 mg/L, watch'}];
const series=(base,amp,n=24,spike)=>Array.from({length:n},(_,i)=>+(base+Math.sin(i/3.2)*amp*.5+(R()-.5)*amp*.6+(spike&&i>n-5?spike*(i-(n-5))/4:0)).toFixed(2));
const spark=(vals,col,lo,hi)=>{const mn=Math.min(lo??Infinity,...vals),mx=Math.max(hi??-Infinity,...vals),r=(mx-mn)||1,X=i=>i*(100/(vals.length-1)),Y=v=>24-(v-mn)/r*22;const d=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');return `<svg viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L100 26L0 26Z" fill="${col}" fill-opacity=".14"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="100" cy="${Y(vals.at(-1)).toFixed(1)}" r="2.2" fill="${col}"/></svg>`;};
const scoreCell=b=>b.score===null?'<span class="pill gr">No data</span>':`<span class="score"><i><em style="width:${b.score}%;background:${b.score>=75?'var(--good)':b.score>=50?'var(--warn)':'var(--crit)'}"></em></i><b class="num">${b.score}</b></span>`;
const statPill=b=>({ok:'<span class="pill ok">Normal</span>',warn:'<span class="pill am">Watch</span>',crit:'<span class="pill rd">Act now</span>',off:'<span class="pill gr">Offline</span>'})[b.status];
const srcCell=s=>`<span class="src"><i style="background:${SRC[s]}"></i>${s}</span>`;
const pctUse=b=>Math.round(b.used/b.need*100);

const PAGES=[
 ['ov','Overview','<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v3h6V4z"/>'],
 ['boxes','Wonder Boxes','<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 6V4M16 6V4M4 12h16"/>'],
 ['events','Water events','<path d="M12 3 2 20h20zM12 9v5M12 17h.01"/>'],
 ['lab','Lab queue','<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>'],
 ['model','The model','<path d="M4 19h16M6 15l4-5 3 3 5-7"/>'],
 ['link','SKUAST-K link','<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>']];
let page='ov',sel='WB-SHP-03';
function navHTML(){return PAGES.map(([k,l,ic])=>`<button class="nav" type="button" data-p="${k}" ${page===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>${l}${k==='events'?`<span class="ct hot">${EVENTS.filter(e=>!e.st[1].startsWith('Closed')).length}</span>`:k==='lab'?`<span class="ct">${LAB.filter(l=>!l.st[1].startsWith('Result')).length}</span>`:k==='boxes'?`<span class="ct">${BOXES.length}</span>`:''}</button>`).join('');}
const head=(eb,t,p,extra='')=>`<div class="ph"><div><div class="eb">${eb}</div><h1>${t}</h1><p>${p}</p></div><div style="display:flex;gap:8px;align-items:center">${extra}<span class="sim">Simulated pilot data</span></div></div>`;

function pOverview(){const live=BOXES.filter(b=>b.status!=='off'),used=live.reduce((a,b)=>a+b.used,0),need=live.reduce((a,b)=>a+b.need,0),over=live.reduce((a,b)=>a+Math.max(0,b.used-b.need),0),open=EVENTS.filter(e=>!e.st[1].startsWith('Closed')).length;
 return head('Wonder Box · Burak Cloud','Water you can finally see','Every litre pumped through a Wonder Box manifold gets a record: how much, how clean, from which source, and whether the crop needed it.')+
 `<div class="kpis">
  <div class="kpi" style="--kc:var(--accent)"><small>Boxes live</small><b class="num">${live.length}<em>of ${BOXES.length}</em></b><span>1 offline, last seen 6 h ago</span></div>
  <div class="kpi" style="--kc:var(--blue)"><small>Water pumped today</small><b class="num">${fmt(used,0)}<em>m³</em></b><span>crop need ${fmt(need,0)} m³</span></div>
  <div class="kpi" style="--kc:var(--saffron)"><small>Over-watering today</small><b class="num">${fmt(over,0)}<em>m³</em></b><span>${Math.round(over/used*100)}% of all water pumped</span></div>
  <div class="kpi" style="--kc:var(--crit)"><small>Open water events</small><b class="num">${open}</b><span>1 needs action now</span></div>
  <div class="kpi" style="--kc:var(--violet)"><small>Lab tests pending</small><b class="num">${LAB.filter(l=>!l.st[1].startsWith('Result')).length}</b><span>at SKUAST-K lab</span></div>
 </div>
 <section class="panel"><h3>How a litre becomes a decision</h3><p class="sub">The same Burak pipeline that reads a sheep's blood, reading a field's water. Counts are for today.</p>
  <div class="pipe">${[['1','Capture','Wonder Box sensors read every 15 minutes, on solar, offline-safe','1,632 readings','var(--accent)'],['2','Check','Faulty sensors, impossible values and gaps caught at entry','14 rejected','var(--saffron)'],['3','Store','Sealed record tied to box, source, farm and crop','1,618 sealed','var(--blue)'],['4','Analyse','Crop need, water health score and named water events','4 events','var(--crit)'],['5','Publish','Advisories and maps pushed to SKUAST-K’s platform','62 records sent','var(--good)']].map(s=>`<div class="st" style="--sc:${s[4]}"><span class="n">${s[0]}</span><b>${s[1]}</b><small>${s[2]}</small><div class="v num">${s[3]}</div></div>`).join('')}</div></section>
 <div class="grid g3">
  <section class="panel"><h3>Pilot sites</h3><p class="sub">Each chip is one Wonder Box. Select one to open it.</p>
   <div class="sites">${SITES.map(s=>`<div class="site"><h4>${s.n}</h4><p>${s.c} · ${s.d}</p><div class="boxes">${BOXES.filter(b=>b.k===s.k).map(b=>`<button class="bx ${b.status==='ok'?'':b.status}" type="button" data-box="${b.id}">${b.id.slice(3)}</button>`).join('')}</div></div>`).join('')}</div></section>
  <section class="panel"><h3>Latest water events</h3><p class="sub">Named when several readings move together.</p>
   <div class="evs">${EVENTS.slice(0,3).map(evRow).join('')}</div></section>
 </div>`;}
function evRow(e){const E=EVT[e.k];return `<div class="ev" style="--ec:${E.c}"><span class="bar"></span><div><h4>${E.n} · <span class="mono" style="font-weight:500">${e.box}</span></h4><p>${e.note}</p><div class="tr">${E.tr.map(t=>`<span>${t}</span>`).join('')}</div></div><div class="meta"><span class="pill ${e.st[0]}">${e.st[1]}</span><span class="mono">${e.id}</span><span>${e.when}</span></div></div>`;}
function pBoxes(){const b=BOXES.find(x=>x.id===sel);
 const rows=BOXES.map(x=>`<tr data-box="${x.id}" aria-selected="${x.id===sel}"><td class="mono">${x.id}</td><td>${x.site.n}</td><td>${x.crop}</td><td>${srcCell(x.src)}</td><td>${statPill(x)}</td><td class="r">${x.status==='off'?'—':pctUse(x)+'%'}</td><td class="r">${x.status==='off'?'—':x.ec}</td><td class="r">${x.status==='off'?'—':x.ph}</td><td class="r">${x.status==='off'?'—':x.turb}</td><td>${scoreCell(x)}</td><td class="r" style="color:var(--ink3)">${x.sync}</td></tr>`).join('');
 return head('Fleet','Wonder Boxes','18 manifolds across three pilot sites. Select a row to see that box in detail.')+
 `<section class="panel" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Box</th><th>Site</th><th>Crop</th><th>Source</th><th>Status</th><th class="r">Use vs need</th><th class="r">EC µS/cm</th><th class="r">pH</th><th class="r">NTU</th><th>Water health</th><th class="r">Last sync</th></tr></thead><tbody>${rows}</tbody></table></div></section>
 ${boxDetail(b)}`;}
function boxDetail(b){if(b.status==='off')return `<section class="panel"><h3>${b.id} is offline</h3><p class="sub">Last seen 6 hours ago. Data is stored in the box and will sync when signal returns.</p></section>`;
 const R2=k=>RANGES[k];const sp={ec:series(b.ec*.85,60,24,b.ev==='runoff'?260:b.ev==='overpump'?120:0),ph:series(b.ph,.25),turb:series(Math.max(.5,b.turb*.4),1.2,24,b.ev==='runoff'?9:b.ev==='contam'?2:0),press:series(b.press+.3,.25,24,b.ev==='overpump'?-1:0),temp:series(b.temp,1.5)};
 const card=(k,v)=>{const [lo,hi,u,n]=R2(k),s=stOf(v,[lo,hi]);return `<div class="rd2 ${s}"><small>${n}</small><b class="num">${v}<em>${u}</em></b><span>normal ${lo}–${hi} ${u}</span>${spark(sp[k],s==='out'?'var(--crit)':s==='watch'?'var(--warn)':'var(--accent)')}</div>`;};
 const days=['11','12','13','14','15','16','17'],nd=days.map((_,i)=>+(b.need*(0.85+0.3*Math.sin(i))).toFixed(1)),us=days.map((_,i)=>+(i===6?b.used:nd[i]*(0.9+R()*(b.ev==='overpump'?0.8:0.35))).toFixed(1)),mx=Math.max(...nd,...us)*1.1;
 const W=520,H=170,L=34,bw=(W-L-10)/7;const Y=v=>H-24-(v/mx)*(H-44);
 let bars=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Water used versus crop need, last 7 days">`;[0,.5,1].forEach(t=>{const v=mx*t;bars+=`<line x1="${L}" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${fmt(v,0)}</text>`;});
 days.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,over=us[i]>nd[i]*1.15,under=us[i]<nd[i]*.7;bars+=`<rect x="${x}" y="${Y(us[i])}" width="${w}" height="${H-24-Y(us[i])}" rx="4" fill="${over?'var(--warn)':under?'var(--blue)':'var(--accent)'}" fill-opacity=".85"/><line x1="${x-3}" x2="${x+w+3}" y1="${Y(nd[i])}" y2="${Y(nd[i])}" stroke="var(--ink)" stroke-width="2"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${d} Oct</text>`;});bars+='</svg>';
 const evs=EVENTS.filter(e=>e.box===b.id);
 return `<div class="det">
  <section class="panel"><h3>${b.id} · readings, last 24 hours</h3><p class="sub">${b.site.n} · ${b.crop} · ${b.src} source. Each reading is compared with this source's own normal.</p>
   <div class="reads">${card('ec',b.ec)}${card('ph',b.ph)}${card('turb',b.turb)}${card('press',b.press)}${card('temp',b.temp)}<div class="rd2"><small>Flow today</small><b class="num">${b.used}<em>m³</em></b><span>crop need ${b.need} m³</span><span style="margin-top:6px;font-weight:600;color:${pctUse(b)>130?'var(--warn)':pctUse(b)<70?'var(--blue)':'var(--good)'}">${pctUse(b)}% of need</span></div></div></section>
  <section class="panel"><h3>Water used against crop need</h3><p class="sub">Bars: water that flowed. Black line: what the crop needed (weather and crop stage).</p>${bars}
   <p class="note">Amber bar: more than 15% over need. Blue bar: less than 70% of need.</p></section>
  <section class="panel"><h3>Water source record</h3><p class="sub">The passport for this source.</p>
   <dl class="kv"><dt>Source</dt><dd>${b.src}</dd><dt>Serves</dt><dd>${b.crop}, ${b.k==='PMP'?'2.1 ha':'1.6 ha'}</dd><dt>Water health score</dt><dd>${b.score} of 100</dd><dt>Source normal (EC)</dt><dd>${Math.round(b.ec*.82)} µS/cm</dd><dt>Last lab test</dt><dd>${b.id==='WB-SHP-03'?'Sample collected today':'1 Oct · none detected'}</dd><dt>Manifold</dt><dd>4 outlets · valve log on</dd><dt>Power</dt><dd>Solar · battery 87%</dd></dl></section>
  <section class="panel"><h3>Events at this box</h3><p class="sub">${evs.length?'Named water events, newest first.':'No events in the last 30 days.'}</p><div class="evs">${evs.map(evRow).join('')||'<p class="note">This source is behaving normally.</p>'}</div></section>
 </div>`;}
function pEvents(){return head('Analyse','Water events','An event is named when several readings move in the same direction, the way Burak Ovine names a disease from a sheep’s blood.')+
 `<section class="panel"><h3>Open and recent</h3><p class="sub">Newest first.</p><div class="evs">${EVENTS.map(evRow).join('')}</div></section>
 <section class="panel"><h3>The five named events</h3><p class="sub">The rules behind each one. Sensors flag; the lab confirms anything chemical.</p><div class="rules">${Object.values(EVT).map(E=>`<div class="rule" style="--ec:${E.c}"><b><i></i>${E.n}</b><p>${E.rule}</p></div>`).join('')}</div></section>`;}
function pLab(){return head('Confirm','Lab queue','Sensors can’t see pesticides. When an event needs it, and once a month as routine, SKUAST-K’s lab tests a sample and the result is written back to the box.')+
 `<section class="panel" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Sample</th><th>Box</th><th>Reason</th><th>Sent</th><th>Test</th><th>Status</th><th>Result</th></tr></thead><tbody>${LAB.map(l=>`<tr data-box="${l.box}"><td class="mono">${l.s}</td><td class="mono">${l.box}</td><td>${l.ev}</td><td>${l.sent}</td><td>${l.test}</td><td><span class="pill ${l.st[0]}">${l.st[1]}</span></td><td>${l.res}</td></tr>`).join('')}</tbody></table></div></section>
 <p class="note">Lab results feed back into the model, so the next contamination watch is sharper.</p>`;}
function pModel(){return head('How it thinks','The model','Three simple pieces, each one explainable to a farmer and defensible to a scientist.')+
 `<div class="steps">
  <div><b>1 · Water need</b><p>How much the crop needed today, from weather and crop stage. The standard FAO crop-water method agronomists already use.</p><div class="f">need = ET0 × Kc − effective rain</div></div>
  <div><b>2 · Water health score</b><p>Each reading compared with that source’s own normal, so a spring and a borewell are each judged fairly.</p><div class="f">z = (reading − source normal) ÷ spread</div></div>
  <div><b>3 · Named events</b><p>When two or more readings move together in a known pattern, the event is named and the right person is told.</p><div class="f">event = pattern match + timing</div></div>
 </div>
 <section class="panel"><h3>What each reading tells us</h3><p class="sub">Low-cost sensors in the Wonder Box manifold.</p>
  <div class="tw"><table><thead><tr><th>Reading</th><th>Normal range</th><th>A rise or fall means</th></tr></thead><tbody>
  <tr><td>Flow</td><td>Set by crop need</td><td>Over- or under-watering; leaks at night</td></tr>
  <tr><td>Pressure</td><td>1.5–3.0 bar</td><td>Pump strain, over-pumping, blocked outlets</td></tr>
  <tr><td>Salts (EC)</td><td>150–700 µS/cm</td><td>Runoff, mineral build-up, a borewell drawn too hard</td></tr>
  <tr><td>pH</td><td>6.5–8.0</td><td>Water that can harm soil and roots</td></tr>
  <tr><td>Cloudiness (turbidity)</td><td>0–5 NTU</td><td>Silt and runoff after rain or spraying</td></tr>
  <tr><td>Water temperature</td><td>Season-dependent</td><td>Context for the other readings</td></tr></tbody></table></div>
  <p class="note" style="margin-top:10px">Ranges are working values for the pilot, to be set with SKUAST-K for each source.</p></section>`;}
let SHARE={sum:true,ev:true,adv:true,raw:false,lab:true};
function pLink(){return head('Publish','SKUAST-K link','Burak Cloud does the capture, checking and analysis. SKUAST-K’s platform publishes the results under its own name. You choose exactly what crosses.','<button class="btn pri" type="button" id="pushNow">Send now</button>')+
 `<section class="panel"><h3>Connection</h3><p class="sub">A secure data link from Burak Cloud to SKUAST-K’s software.</p>
  <div class="link"><div class="end"><b>Burak Cloud</b><small>Wonder Box pipeline · Burak owns the platform</small></div><div class="wire" aria-hidden="true"></div><div class="end"><b>SKUAST-K platform</b><small>Publishes advisories, maps and research · SKUAST-K owns the data</small></div></div></section>
 <div class="grid g2">
  <section class="panel"><h3>What we share</h3><p class="sub">Each switch controls one kind of record.</p><div class="tog">
   ${[['sum','Daily summaries','Use vs need and water health score, per box per day'],['ev','Water events','Every named event and its status'],['adv','Farmer advisories','Irrigate, wait or warn, ready to publish'],['lab','Lab results','Pesticide and nitrate results from SKUAST-K’s own lab'],['raw','Raw sensor readings','Every 15-minute reading (large; off by default)']].map(t=>`<label><input type="checkbox" id="sh-${t[0]}" data-sh="${t[0]}" ${SHARE[t[0]]?'checked':''}><span>${t[1]}<small>${t[2]}</small></span></label>`).join('')}
  </div></section>
  <section class="panel"><h3>Sent today</h3><p class="sub">Every send is fingerprinted, so both sides can audit it.</p>
   <div class="log" id="log">${[['09:00','Daily summaries · 17 boxes','62 records'],['06:52','Event E-1042 · Runoff','1 record'],['06:52','Advisory · Shopian growers: avoid WB-SHP-03 source','1 record'],['Yesterday','Event E-1041 · Over-pumping','1 record']].map(r=>`<div><span class="mono">${r[0]}</span><span>${r[1]}</span><span style="color:var(--ink3)">${r[2]}</span></div>`).join('')}</div></section>
 </div>
 <section class="panel"><h3>What a record looks like</h3><p class="sub">One daily summary, as SKUAST-K’s software receives it.</p>
 <div class="code">{
  "box": "WB-SHP-03",
  "site": "Shopian",  "crop": "apple, high-density",  "source": "spring",
  "date": "2026-10-17",
  "water_m3": { "used": ${BOXES[2].used}, "need": ${BOXES[2].need} },
  "water_health": ${BOXES[2].score},
  "readings": { "ec_uS_cm": 812, "ph": ${BOXES[2].ph}, "turbidity_ntu": 11.8, "pressure_bar": ${BOXES[2].press} },
  "events": ["E-1042 runoff"],
  "lab": "S-2207 collected",
  "fingerprint": "b7e1…9c2a",
  "simulated": true
}</div></section>`;}
const R_={ov:pOverview,boxes:pBoxes,events:pEvents,lab:pLab,model:pModel,link:pLink};
function render(){$('#nav').innerHTML=navHTML();$('#view').innerHTML=R_[page]();$('#crumb').innerHTML=`Wonder Box / <b>${PAGES.find(p=>p[0]===page)[1]}</b>`;}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
document.addEventListener('click',e=>{const n=e.target.closest('[data-p]');if(n){page=n.dataset.p;render();window.scrollTo({top:0});return;}
 const b=e.target.closest('[data-box]');if(b){sel=b.dataset.box;page='boxes';render();const d=document.querySelector('.det');if(d&&e.target.closest('.bx,#view tbody tr'))d.scrollIntoView({behavior:'smooth',block:'start'});return;}
 const tz=e.target.closest('[data-toast]');if(tz){toast(tz.dataset.toast);return;}
 if(e.target.id==='pushNow'){const on=Object.entries(SHARE).filter(([,v])=>v).length;const lg=$('#log');lg.insertAdjacentHTML('afterbegin',`<div><span class="mono">${new Date().toTimeString().slice(0,5)}</span><span>Manual send · ${on} record types</span><span style="color:var(--ink3)">queued</span></div>`);toast('Sent to SKUAST-K. They’ll see it on their platform.');}
 if(e.target.id==='themeBtn'){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';}});
document.addEventListener('change',e=>{const s=e.target.dataset.sh;if(s){SHARE[s]=e.target.checked;toast(`${e.target.closest('label').querySelector('span').firstChild.textContent.trim()} ${e.target.checked?'will be shared':'will not be shared'}.`);}});
render();
</script>
